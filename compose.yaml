services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: autobros
      POSTGRES_PASSWORD: autobros
      POSTGRES_USER: autobros
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobros -d autobros"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
